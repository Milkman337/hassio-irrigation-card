name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Typecheck, build & lint
        run: |
          devenv shell -- bash -lc "npm ci && npm run typecheck && npm run build && npm run lint"

      - name: Upload built card
        uses: actions/upload-artifact@v4
        with:
          name: hassio-irrigation-card
          path: dist/hassio-irrigation-card.js
